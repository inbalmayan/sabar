<title>צבר רפואה</title>
<style>
:root{--navy:#1f1466;--coral:#f5857b;--ink:#1f1a3d;--muted:#6b6785;--line:#e7e5f0;--bg:#faf9fc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;padding:24px}
.box{width:min(380px,100%);background:#fff;border:1px solid var(--line);border-top:3px solid var(--coral);border-radius:14px;padding:28px 24px;text-align:center}
img{height:84px;width:auto;display:block;margin:0 auto 12px}
h1{font-size:20px;color:var(--navy);margin:0 0 4px}
p{color:var(--muted);margin:0 0 18px;font-size:14px}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid #d8d5e6;border-radius:9px;text-align:center;direction:ltr;letter-spacing:.04em}
input:focus{outline:2px solid var(--navy);border-color:transparent}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:9px;background:var(--navy);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:#c4574d;font-size:13.5px;min-height:20px;margin-top:10px}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
 return new TextDecoder().decode(buf)}
function show(html){document.open();document.write(html);document.close()}
async function tryPw(pw,silent){
 const err=document.getElementById('err'),btn=document.getElementById('go');
 if(!silent){err.textContent='';btn.disabled=true;btn.textContent='בודק...'}
 try{const html=await unlock(pw);try{sessionStorage.setItem('tz_k',pw)}catch(e){}show(html)}
 catch(e){try{sessionStorage.removeItem('tz_k')}catch(x){}if(!silent){err.textContent='סיסמה שגויה. נסו שוב.';btn.disabled=false;btn.textContent='כניסה'}}}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('pw').value;if(v)tryPw(v,false)});
try{const k=sessionStorage.getItem('tz_k');if(k)tryPw(k,true)}catch(e){}
</script>
