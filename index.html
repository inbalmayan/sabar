<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>התשתית המקצועית והאקדמית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f1466;--navy2:#4a41a0;--coral:#f5857b;--coral-s:#fdecea;--coral-d:#c4574d;--ink:#1f1a3d;--muted:#6b6785;--line:#e7e5f0;--bg:#faf9fc;--card:#fff;--tint:#f1effa;--ok:#2f7d6b;--ok-s:#e6f3ef}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--navy2)}
bdi[dir=ltr]{unicode-bidi:isolate}
header.top{background:#fff;border-bottom:3px solid var(--coral)}
.hd{max-width:1280px;margin:0 auto;padding:10px 24px 0;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hd img{height:74px;width:auto;display:block}
.hd .ttl{font-weight:800;color:var(--navy);font-size:18px;line-height:1.2}
.hd .ttl small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
nav{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto}
nav a{padding:12px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap}
nav a:hover{color:var(--navy)}
nav a.on{color:var(--navy);font-weight:700;border-bottom-color:var(--navy)}
main{max-width:1280px;margin:0 auto;padding:24px 24px 40px}
h1{font-size:34px;font-weight:800;color:var(--navy);margin:0;line-height:1.15}
h2{font-size:20px;font-weight:700;color:var(--navy);margin:0}
h3{font-size:15px;font-weight:700;color:var(--navy);margin:0}
.lead{color:var(--muted);font-size:17px;margin:4px 0 0;letter-spacing:.02em}
.hero4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;margin-bottom:16px}
.ht{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:3px solid var(--navy)}
.ht-h{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-weight:500;font-size:14px}
.big{display:block;border:0;background:none;padding:0;margin:4px 0 10px;font-size:46px;font-weight:800;color:var(--navy);line-height:1.1;text-align:start}
.big.txt{font-size:28px;padding-top:10px}
.big.pend{font-size:16px;font-weight:500;color:var(--muted);padding-top:18px;text-decoration:underline dotted}
.brs{display:flex;flex-direction:column;gap:4px}
.br{display:flex;align-items:center;gap:8px;border:0;background:none;padding:2px 0;width:100%}
.br .by{width:34px;font-size:12.5px;color:var(--muted);text-align:start}
.br .trk{flex:1;height:10px;background:var(--tint);border-radius:5px;overflow:hidden;display:block}
.br .trk.none{background:repeating-linear-gradient(45deg,#f1effa,#f1effa 4px,#fff 4px,#fff 8px);border:1px dashed #d8d5e6}
.br .trk i{display:block;height:100%;background:#b9b4e0;border-radius:5px}
.br.cur .trk i{background:var(--navy)}
.br.cur .by,.br.cur .bv{color:var(--navy);font-weight:700}
.br .bv{min-width:66px;font-size:13px;text-align:end;color:var(--muted)}
.hb{display:flex;flex-direction:column;gap:3px}
.hrow{display:flex;align-items:center;gap:10px;border:0;background:none;padding:3px 0;width:100%;text-align:start}
.hrow .hl{width:128px;font-size:13px;color:var(--ink);flex:none}
.hrow .htrk{flex:1;height:14px;background:#f6f5fb;border-radius:4px;overflow:hidden;display:block}
.hrow .htrk i{display:block;height:100%;border-radius:4px}
.hrow b{width:22px;color:var(--navy);text-align:end}
.hrow:hover .hl{color:var(--navy2);text-decoration:underline}
.ph0{background:#d8d4f0}.ph1{background:#a49cdc}.ph2{background:#6a60c4}.ph3{background:#1f1466}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.lg span{display:flex;align-items:center;gap:5px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;flex:none}
.sw.dash{border:1.5px dashed var(--coral)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:none;padding:7px 0;width:100%;text-align:start}
.prow:last-child{border-bottom:0}
.prow:hover .pn{color:var(--navy2);text-decoration:underline}
.prow .pn{font-size:14px;font-weight:500}
.prow.opp .pn{color:var(--muted)}
.pd{display:flex;gap:14px;flex:none}
.dots{display:flex;gap:3px;align-items:center;min-width:62px}
.dots small{font-size:11px;color:var(--muted)}
.sq,.ci{display:inline-block;width:10px;height:10px;flex:none}
.sq{border-radius:2px}.ci{border-radius:50%}
.c1{background:var(--navy)}.c2{background:var(--coral)}
.donutw{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;border:0;position:relative;flex:none;padding:0}
.donut::after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.donut.empty{background:none;border:2px dashed #d8d5e6}
.donut.empty::after{display:none}
.donut span{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.donut b{font-size:30px;font-weight:800;color:var(--navy)}
.donut small{font-size:12px;color:var(--muted);max-width:90px;text-align:center}
.dl{flex:1;min-width:190px;display:flex;flex-direction:column}
.dli{display:flex;align-items:center;gap:8px;border:0;background:none;border-bottom:1px solid var(--line);padding:7px 0;text-align:start;width:100%}
.dli:last-child{border-bottom:0}
.dli span:first-of-type{flex:1;font-size:14px}
.dli b{color:var(--navy)}
.asts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ast{border:1px solid var(--line);background:var(--tint);border-radius:10px;padding:10px;text-align:start;display:flex;flex-direction:column;gap:2px}
.ast b{font-size:30px;font-weight:800;color:var(--navy);line-height:1.1}
.ast b.pend{font-size:14px;font-weight:500;color:var(--muted);padding:8px 0}
.ast span{font-size:13px}.ast small{font-size:11.5px;color:var(--muted)}
.tl{display:flex;margin-top:16px;position:relative}
.tl::before{content:"";position:absolute;top:6px;inset-inline:16%;height:2px;background:var(--line)}
.tn{flex:1;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center}
.tn i{width:14px;height:14px;border-radius:50%;background:var(--navy);border:3px solid #fff;box-shadow:0 0 0 1px var(--navy)}
.tn.fut i{background:#fff;box-shadow:0 0 0 1.5px var(--coral)}
.tn b{font-size:14px;color:var(--navy);margin-top:3px}.tn small{font-size:11.5px;color:var(--muted)}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.asts{grid-template-columns:1fr}}
.scns{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 16px}
.scn{flex:1;min-width:240px;text-align:start;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.scn b{color:var(--navy);font-size:16px}.scn .sv{color:var(--muted);font-size:13.5px}
.scn.on{border:2px solid var(--navy);background:var(--tint);padding:11px 15px}
.tbar{display:block;flex:1;min-width:70px;height:10px;background:var(--tint);border-radius:5px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--navy);border-radius:5px}
.tbar.none{background:repeating-linear-gradient(45deg,#f1effa,#f1effa 4px,#fff 4px,#fff 8px);border:1px dashed #d8d5e6}
.tabsrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live-b{border:1px solid var(--coral);background:#fff;color:var(--coral-d);border-radius:10px;padding:8px 16px;font-weight:500;display:flex;gap:7px;align-items:center}
.live-b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--coral)}
.live-b.on{background:var(--coral-s);font-weight:700}
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px;margin:6px 0 4px}
.fn{position:relative;text-align:start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;overflow:visible;display:flex;flex-direction:column;gap:4px}
.fn:not(:last-child)::after{content:"←";position:absolute;inset-inline-end:-17px;top:42px;color:var(--coral);font-weight:800;font-size:16px}
.fn.on{border:2px solid var(--navy);padding:13px 13px 11px}
.fn:hover{border-color:var(--navy2)}
.fbar{display:block;height:5px;border-radius:3px;margin-bottom:6px}
.fl{font-weight:700;color:var(--navy)}
.fnum{font-size:38px;font-weight:800;color:var(--navy);line-height:1.1}
.fdep{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.fdep span{display:flex;justify-content:space-between}
.fdep b{color:var(--navy)}
.ph4{background:#1f1466}.ph5{background:var(--coral)}.ph3{background:#3b3190}
.mx td,.mx th{padding:8px 12px}
.mc{text-align:center}
.pill{border:0;border-radius:8px;min-width:34px;padding:3px 10px;font-weight:800;color:var(--navy)}
.lnk{border:0;background:none;padding:0;color:var(--navy);font-weight:500;text-align:start}
.lnk:hover{text-decoration:underline}
.selrow td{background:var(--tint)}
.warnbar{background:var(--coral-s);border:1px solid var(--coral);color:#7a2f28;border-radius:10px;padding:10px 14px;margin-bottom:16px}
.ch .tot{font-size:22px;font-weight:800;color:var(--navy)}
.cgrid{display:grid;grid-template-columns:1fr 1.2fr;gap:28px;align-items:start}
.mb .big{font-size:42px;margin:2px 0 8px}
.dvd{height:1px;background:var(--line);margin:14px 0}
@media(max-width:760px){.cgrid{grid-template-columns:1fr}}
.sech{font-size:20px;font-weight:800;color:var(--navy);margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);position:relative}
.sech::after{content:"";position:absolute;inset-inline-start:0;bottom:-1px;width:36px;height:2px;background:var(--coral)}
.sech2{font-size:15px;font-weight:700;color:var(--navy);margin:20px 0 6px}
tr.gh td{background:var(--tint);font-weight:800;color:var(--navy);font-size:13px}
.ph0{background:#dcd8f4}.ph1{background:#9c91e2}.ph2{background:#5848bd}.ph3{background:#1f1466}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--navy);color:#fff;padding:6px 11px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .12s;transform:translate(-50%,-100%);white-space:nowrap;box-shadow:0 6px 18px rgba(31,20,102,.3)}
.tip.on{opacity:1}
@keyframes grow{from{transform:scaleX(0)}}
.htrk i,.trk i,.tbar i{transform-origin:100% 50%;animation:grow .8s cubic-bezier(.2,.8,.2,1) backwards;transition:filter .15s}
.hrow .htrk,.br .trk{transition:transform .15s}
.hrow:hover .htrk,.br:hover .trk{transform:scaleY(1.5)}
.hrow:hover i,.br:hover i{filter:brightness(1.15)}
.hrow:hover .hl{color:var(--navy);font-weight:700}
.fn{transition:transform .18s,box-shadow .18s,border-color .18s}
.fn:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(31,20,102,.14)}
.cat,.icard,.stg{transition:transform .18s,box-shadow .18s,border-color .18s}
.cat:hover,.icard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(31,20,102,.12)}
.pill{transition:transform .15s}.pill:hover{transform:scale(1.2)}
.big{transition:transform .15s}.big:hover{transform:scale(1.04)}
.donut2{position:relative;width:170px;height:170px;align-self:center}
.donut2 .ring{width:100%;height:100%;overflow:visible}
.ring .seg{cursor:pointer;transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1),stroke-width .18s,opacity .18s;outline:none}
.ring .seg.on{stroke-width:22}.ring .seg.dim{opacity:.35}
.donut2 .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;line-height:1.15;text-align:center}
.donut2 .rc b{font-size:34px;font-weight:800;color:var(--navy)}
.donut2 .rc small{font-size:12px;color:var(--muted);max-width:88px}
.dli{transition:background .15s}.dli:hover,.dli.hl{background:var(--tint)}
.dli.hl b{color:var(--coral-d)}
@media(prefers-reduced-motion:reduce){.htrk i,.trk i,.tbar i{animation:none}.ring .seg{transition:none}}
.mat{margin-top:14px}.matbar{display:flex;height:24px;border-radius:6px;overflow:hidden;margin-top:6px;gap:2px}.matbar span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;min-width:20px}.matbar .ph0{color:var(--navy)}.dmo{font-size:12px;color:var(--muted);min-width:56px;text-align:end;white-space:nowrap}
.b-goal{background:var(--tint);color:var(--navy);border:1px solid #cfc9ee}
.plan .plead{font-size:17px;max-width:70ch;margin:0 0 14px;color:var(--ink)}
.kpi3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.kpi2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kcard{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:12px;padding:14px 16px}
.kcard .ht-h{gap:8px;align-items:center}
.kval{font-size:38px;font-weight:800;color:var(--navy);line-height:1.15;margin:6px 0}
.plan .sub{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.plan .sub p{margin:6px 0 10px}
.pl{margin:6px 0;padding-inline-start:20px}.pl li{margin:3px 0}
.callout{background:var(--coral-s);border-radius:10px;padding:10px 14px;margin:12px 0;color:#7a2f28}
@media(max-width:640px){.kpi2{grid-template-columns:1fr}.kval{font-size:30px}}
@media print{.kcard,.sub,.callout{break-inside:avoid}}
.gt{font-size:12.5px;font-weight:800;color:var(--navy);letter-spacing:.03em;margin:10px 0 2px;padding-top:4px;display:flex;gap:6px;align-items:center}.gt small{font-weight:500;color:var(--muted)}
.ptag{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;border:1.5px solid var(--coral);color:var(--coral-d);font-size:12px;font-weight:800;background:#fff}.ptag.z{border-color:#e1deec;color:#c6c3d6;font-weight:400}
.kpi4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pills{display:inline-flex;gap:4px;margin-inline-start:6px;vertical-align:middle}
.pill2{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--navy);color:#fff}
.cols2.top{align-items:start}
.dt{border-top:1px solid var(--line);padding:8px 0;margin-top:8px}
.dt summary{cursor:pointer;font-weight:700;color:var(--navy);padding:2px 0}
.dt summary:hover{color:var(--navy2)}
.dtb{padding-top:6px}
.plan .card{padding:16px 18px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.seg{display:inline-flex;background:var(--tint);border-radius:10px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:7px;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--navy);font-weight:700;box-shadow:0 1px 3px rgba(31,20,102,.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card>.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;padding-bottom:10px;border-bottom:1px solid var(--line);position:relative}
.card>.ch::after{content:"";position:absolute;inset-inline-start:0;bottom:-1px;width:36px;height:2px;background:var(--coral)}
.more{background:none;border:0;color:var(--navy2);font-size:13px;padding:0}
.more:hover{text-decoration:underline}
.mrow{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .ml{flex:1;min-width:0}
.mt{font-weight:500}
.ms{color:var(--muted);font-size:13px}
.num{border:0;background:none;padding:0;font-size:30px;font-weight:800;color:var(--navy);min-width:64px;text-align:start;line-height:1.1;border-bottom:2px solid transparent}
.num:hover{border-bottom-color:var(--coral)}
.num.pend{font-size:13px;font-weight:500;color:var(--muted);min-width:64px;max-width:90px;line-height:1.25;border-bottom:0;text-decoration:underline dotted}
.num.sm{font-size:22px}
.cmp{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;font-size:13px;color:var(--muted);white-space:nowrap}
.cmp:hover{border-color:var(--navy2);color:var(--navy)}
.snaph{font-size:12px;color:var(--muted);margin:10px 0 0;letter-spacing:.04em}
.proof{margin:2px 0 8px;padding:8px 12px;background:var(--coral-s);border-radius:8px;font-size:13px;color:#7a2f28;cursor:pointer;border:0;text-align:start;width:100%}
.proof b{font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--tint);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--navy)}
.chip:hover{border-color:var(--navy2)}
.chip b{font-weight:800;margin-inline-start:4px}
.bdg{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--tint);color:var(--navy);white-space:nowrap}
.b-warn{background:var(--coral-s);color:#8a3028}
.b-ok{background:var(--ok-s);color:var(--ok)}
.b-opp{background:#fff;color:var(--coral-d);border:1px dashed var(--coral)}
.dash{color:#b5b2c6}
.tag-prop{display:inline-block;border:1px dashed var(--coral);color:var(--coral-d);border-radius:6px;padding:1px 9px;font-size:12px;font-weight:700}
/* pipeline tiles */
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:10px}
.stg{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 8px;text-align:center;position:relative}
.stg:hover{border-color:var(--navy2)}
.stg.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
.stg .n{display:block;font-size:24px;font-weight:800;color:var(--navy);line-height:1.1}
.stg .n.z{color:#c6c3d6}
.stg .s{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.25}
.stg .i{position:absolute;top:5px;inset-inline-start:7px;font-size:10px;color:#b5b2c6}
.phase{margin-top:14px}
.phase h3{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.04em}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{background:var(--tint);color:var(--navy);font-weight:700;white-space:nowrap;font-size:13px;position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{background:#e8e5f6}
tbody tr{cursor:pointer}
tbody tr:hover{background:#faf8ff}
tbody tr.arch{opacity:.55}
tr.foot td{background:var(--tint);font-weight:700;cursor:default}
td.nw{white-space:nowrap}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.in,select.in,textarea.in{font:inherit;border:1px solid #d8d5e6;border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);min-width:0}
.in:focus{outline:2px solid var(--navy2);outline-offset:0;border-color:transparent}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:7px 16px;font-weight:500}
.btn:hover{background:#2b2085}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.ghost:hover{background:var(--tint)}
.btn.warn{background:#fff;color:var(--coral-d);border-color:var(--coral)}
.cnt{color:var(--muted);font-size:13px;margin-inline-start:auto}
.sub-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 8px}
.sub-tabs button{border:0;background:none;padding:10px 16px;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
.sub-tabs button.on{color:var(--navy);font-weight:700;border-bottom-color:var(--coral)}
.pgh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.note{color:var(--muted);font-size:13.5px;margin:6px 0}
.sec{margin-top:26px}
.sec>h2{margin-bottom:10px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(31,20,102,.35);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:50}
.dlg{background:#fff;border-radius:14px;width:min(860px,100%);box-shadow:0 20px 60px rgba(31,20,102,.3)}
.dlg.wide{width:min(1100px,100%)}
.dh{display:flex;justify-content:space-between;gap:12px;padding:18px 22px 12px;border-bottom:3px solid var(--coral)}
.dh h2{font-size:22px}
.dh .sub{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:70ch}
.x{border:0;background:var(--tint);width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;color:var(--navy);flex:none}
.db{padding:16px 22px 22px}
.formula{margin-top:12px;padding:10px 14px;background:var(--tint);border-radius:8px;font-size:14px;color:var(--navy)}
.formula b{font-weight:800}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--tint);border-radius:10px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fg .full{grid-column:1/-1}
.fg label{display:block;font-size:13px;font-weight:500;color:var(--navy);margin-bottom:3px}
.fg .in{width:100%}
.fg textarea.in{min-height:70px;resize:vertical}
.fgh{grid-column:1/-1;font-size:13px;font-weight:800;color:var(--coral-d);margin-top:8px;padding-bottom:4px;border-bottom:1px solid var(--line);letter-spacing:.03em}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 10px;border:1px solid #d8d5e6;border-radius:8px;max-height:130px;overflow:auto}
.chk label{display:flex;gap:6px;align-items:center;font-weight:400;color:var(--ink);margin:0}
.fa{display:flex;gap:8px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.fa .upd{margin-inline-start:auto;color:var(--muted);font-size:13px}
.err{border-color:var(--coral-d)!important;background:var(--coral-s)!important}
/* misc blocks */
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.catg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cat{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;text-align:start;display:block;width:100%}
.cat:hover{border-color:var(--navy2)}
.cat h3{margin-bottom:2px}
.cat .typ{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.cat .yr{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;border-top:1px solid var(--line)}
.cat .yr span:last-child{font-weight:700;color:var(--navy)}
.cat .yr .p{font-weight:400;color:var(--muted)}
.cat.prop{border:1.5px dashed var(--coral);background:#fffafa}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:6px 0 16px}
.flow>div{flex:1;min-width:150px;background:var(--tint);padding:12px 16px;font-weight:700;color:var(--navy);text-align:center;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);margin-inline-start:-10px}
[dir=rtl] .flow>div{clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 50%,100% 100%,14px 100%,0 50%)}
.flow>div:first-child{margin-inline-start:0}
.flow>div.c{background:var(--coral-s);color:#7a2f28}
.flow small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.case{border-inline-start:4px solid var(--coral);background:#fff;padding:14px 18px;border-radius:0 10px 10px 0;border:1px solid var(--line);border-inline-start:4px solid var(--coral)}
.case p{margin:4px 0}
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.icard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:start;display:block}
.icard:hover{border-color:var(--navy2)}
.icard h3{font-size:16px;margin-bottom:2px}
.icard .meta{color:var(--muted);font-size:13px}
.icard .st{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.icard .st b{color:var(--navy);font-size:15px}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover .lt{color:var(--navy2)}
.lt{font-weight:500}
.kv{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 18px}
.kv .k{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 16px;display:flex;align-items:center;gap:10px}
.back{background:none;border:0;color:var(--navy2);padding:0;margin-bottom:8px;font-size:14px}
footer{max-width:1280px;margin:0 auto;padding:0 24px 40px}
.princ{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px;padding:14px 0;border-top:1px solid var(--line);margin-top:28px}
.princ span.a{color:var(--coral)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px}
.tools .btn{padding:4px 12px;font-size:12.5px}
td input.in{width:100%;min-width:90px;padding:5px 8px}
.pct{font-weight:800;color:var(--navy)}
@media(max-width:640px){main{padding:16px}.hd{padding:8px 16px 0}.grid{grid-template-columns:1fr}h1{font-size:26px}.fg{grid-template-columns:1fr}.cols2{grid-template-columns:1fr}.hd img{height:56px}}
</style>
</head>

function txt(ent,r,k){
 const f=fld(ent,k);let v=f.calc?f.calc(r):r[k];if(v==null||v==='')return '';
 switch(f.t){
  case'insts':return(v||[]).map(id=>nm('insts',id)).filter(Boolean).join('، ');
  case'ref':return nm(f.ref,v);
  case'bool':return v?'כן':'לא';
  case'date':return fmtD(v);
  case'num':if(k==='pubYear')return String(v);return (k==='amount'?(r.cur||'₪'):k==='fundAmt'?(r.fundCur||'₪'):'')+num(v);
  default:return String(v)}}

 return t}

 if(data.pubs){P.ents.pubs=[];rowsOf('pubs').forEach(r=>{const title=norm(r['כותרת']);if(!title)return;const pmid=norm(r['PMID']),doi=norm(r['DOI']);const key=pmid||doi.toLowerCase()||nkey(title);

 (P.ents.insts||[]).forEach(it=>{if(it.ex){if(it.act!=='ללא שינוי'){Object.assign(it.ex,it.rec,{updated:T,archived:false});log.changed.push({ent:'insts',name:it.label,fields:it.changed.map(k=>P.lab('insts',k))})}}
